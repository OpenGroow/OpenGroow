name: Release

# Pushing a tag `<name>@<version>` (e.g. seo@1.2.0) releases packages/<name>:
# `pnpm pack` it, attach the .tgz to a GitHub Release, and open a
# PR that points the package's entry in index.json at the new asset and digest.
# A tag `publisher-<id>@<version>` (e.g. publisher-postiz@1.0.0) releases the
# Publisher package packages/publisher/<id> the same way: it is built with
# `groowhub pack publisher` (@opengroow/groowhub-cli) and listed in publishers.json instead of index.json.
# The PR is the human gate: the index decides what installs on users'
# deployments. No secret is used; only the workflow's own GITHUB_TOKEN.

on:
  push:
    tags:
      - "*@*"

# Nothing by default; the job asks for exactly what it needs.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release, push the index branch
      pull-requests: write # open the index PR
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      # The hub's tooling, published from the OpenGroow repository. Bump when a manifest format changes.
      GROOWHUB_CLI: "@opengroow/groowhub-cli@0.1.0"
    steps:
      - name: Read the tag
        id: tag
        run: |
          if ! [[ "$TAG" =~ ^([a-z0-9][a-z0-9-]*)@([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::Tag \"$TAG\" is not <name>@<semver>"
            exit 1
          fi
          name="${BASH_REMATCH[1]}"
          if [[ "$name" == publisher-* ]]; then
            echo "dir=packages/publisher/${name#publisher-}" >> "$GITHUB_OUTPUT"
            echo "index=publishers.json" >> "$GITHUB_OUTPUT"
            echo "publisher=true" >> "$GITHUB_OUTPUT"
          else
            echo "dir=packages/$name" >> "$GITHUB_OUTPUT"
            echo "index=index.json" >> "$GITHUB_OUTPUT"
            echo "publisher=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: true # needed to push the index branch below
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          if [ "${{ steps.tag.outputs.publisher }}" = "true" ]; then
            npx --yes "$GROOWHUB_CLI" pack publisher "${{ steps.tag.outputs.dir }}" --out "$RUNNER_TEMP/dist"
          else
            npm pack "./${{ steps.tag.outputs.dir }}" --pack-destination "$RUNNER_TEMP/dist"
          fi
          file=$(ls "$RUNNER_TEMP"/dist/*.tgz)
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "sha256:$(sha256sum "$file" | cut -d' ' -f1)"
      - name: Create the release with the asset
        run: |
          gh release create "$TAG" "${{ steps.pack.outputs.file }}" --title "$TAG" \
            --notes "Release asset: $(basename '${{ steps.pack.outputs.file }}')"
      - name: Point index.json at the release (PR)
        run: |
          git fetch origin main
          git switch -c "release/$TAG" origin/main
          node tools/update-index.mjs --index "${{ steps.tag.outputs.index }}" \
            --package "${{ steps.tag.outputs.dir }}" \
            --repository "$GITHUB_REPOSITORY" --tag "$TAG" \
            --file "${{ steps.pack.outputs.file }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $TAG"
          git push origin "release/$TAG"
          gh pr create --base main --head "release/$TAG" \
            --title "Release $TAG" \
            --body "Points the index entry at the new release asset. The digest is the sha256 of the asset attached to the $TAG release; review it against the release before merging."
