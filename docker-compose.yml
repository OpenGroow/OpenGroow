# Unified self-host stack: `docker compose up` from a clean checkout brings
# up the shared platform (Convex, broker, dashboard, openclaw-connect). It
# does not include an OpenClaw gateway/runtime-worker of its own — every
# Project's gateway+worker is created dynamically, on demand, by
# apps/openclaw-local-control (a native host process, run separately — see
# README.md) when you click "Create New Project" in the dashboard. There is
# only one way to get a running Project: through the dashboard.
#
# This is the primary, generic-Docker-host path.
#
# This file is a compose *fragment*, not the whole stack — it only adds the
# services/overrides that glue the other fragments together (broker,
# dashboard, the broker<->Convex secret, and image-build overrides for the
# OpenClaw containers). The full layered file list lives in .env's
# COMPOSE_FILE, so plain `docker compose up` picks up all of it: YAML
# `include:` was tried first, but it merges each included file as an
# independent sub-project rather than an `-f`-style override layer — a
# later include couldn't actually override an earlier one's same service
# (verified: docker-compose.local.yml's named-volume override never took
# effect on top of the base fragment when wired via `include:`).
name: opengroow

services:
  # Convex deployment env vars (issue #264's placeholders, overridden here
  # with this stack's real service addresses and secrets) plus the
  # broker<->Convex HMAC secret generated by broker-secrets-bootstrap below.
  convex-bootstrap:
    depends_on:
      convex-admin-key:
        condition: service_completed_successfully
      convex-backend:
        condition: service_healthy
      broker-secrets-bootstrap:
        condition: service_completed_successfully
    volumes:
      - convex-data:/convex/data:ro
      - broker-secrets:/run/broker-secrets:ro
    environment:
      - CONVEX_SELF_HOSTED_URL=${CONVEX_SELF_HOSTED_URL:-http://convex-backend:3210}
      - DASHBOARD_URL=${DASHBOARD_URL:-http://localhost:3912}
      - BROKER_URL=http://broker:4300
      - BROKER_SECRETS_FILE=/run/broker-secrets/broker-secrets.env
      # OpenClaw Control API (issue #303): points at
      # apps/openclaw-local-control (issue #305), not at a remote
      # control-plane — the local InstanceProvisioner (wired by
      # INSTANCE_PROVISIONER below) is the only
      # one this stack ever calls. apps/openclaw-local-control is
      # a native host process under `pnpm dev` (a container with the Docker
      # socket mounted under `pnpm start`, see docker-compose.start.yml and
      # docs/START.md), so from inside convex-backend's container
      # "localhost" is the container itself — host.docker.internal is
      # Docker's own DNS name for the host (see convex-backend's
      # extra_hosts in apps/convex/docker/docker-compose.yml, required for
      # this to resolve on Linux). Key id/secret match
      # apps/openclaw-local-control's own defaults (config.ts, local-
      # control-server.ts's DEFAULT_KEYS) — override only if you changed
      # OPENCLAW_LOCAL_CONTROL_PORT/KEYS on that side.
      - OPENCLAW_CONTROL_URL=${OPENCLAW_CONTROL_URL:-http://host.docker.internal:4610}
      - OPENCLAW_CONTROL_KEY_ID=${OPENCLAW_CONTROL_KEY_ID:-convex}
      - OPENCLAW_CONTROL_SECRET=${OPENCLAW_CONTROL_SECRET:-convex-secret}
      # apps/convex/env.ts's default points at OpenGroow's own production
      # relay (ADR-031) — wrong for this stack, which has no such service.
      # Points instead at an openclaw-connect instance run directly on the
      # host (its own default PORT, not a compose service — see ADR-031),
      # reachable via the broker port this stack now publishes to the host.
      - OPENCLAW_CONNECT_PUBLIC_BASE_URL=${OPENCLAW_CONNECT_PUBLIC_BASE_URL:-http://localhost:4700}
      # Wires apps/convex/instance_provisioning/index.ts onto localProvisioner
      # (ADR-033) — without it, the default remote control-plane provisioner
      # would be used and "Create Project" would fail trying to reach the
      # OpenClaw Control placeholders above.
      - INSTANCE_PROVISIONER=${INSTANCE_PROVISIONER:-local}
      # Self-host trust rules (outbound URL checks, scope reservation, MCP URL
      # overrides). No-op in the OSS export.
      - IS_SELF_HOST=${IS_SELF_HOST:-1}
      # Connect ticket lifetime (0 = never expires). Not persisted anywhere
      # but the convex-data volume's Convex-managed env store, so it must be
      # re-pushed on every bootstrap run or a volume reset silently reverts
      # it to entrypoint.sh's own 30-minute default.
      - OPENCLAW_CONNECT_TICKET_TTL_MS=${OPENCLAW_CONNECT_TICKET_TTL_MS:-1800000}
      # Optional OpenClaw plugins (codex, whatsapp, ...): Convex skips the
      # features of the ones not listed. Same value as the Instances get.
      - OPENCLAW_OPTIONAL_PLUGINS=${OPENCLAW_OPTIONAL_PLUGINS:-}

  # One-shot: generates this stack's remaining secrets exactly once and
  # persists them to a shared volume — the broker<->Convex HMAC secret,
  # BETTER_AUTH_SECRET (read directly by the better-auth library inside the
  # Convex deployment; without it, sign-up/sign-in fail with "You are using
  # the default secret"), and BROKER_ADMIN_TOKEN (guards the broker's
  # optional admin-relay endpoints). Same idempotent pattern as
  # apps/convex/docker/docker-compose.yml's convex-admin-key.
  broker-secrets-bootstrap:
    image: alpine:3.20
    restart: "no"
    volumes:
      - broker-secrets:/secrets
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        ENV_FILE=/secrets/broker-secrets.env
        if [ -s "$$ENV_FILE" ]; then
          echo "Stack secrets already present, reusing."
          exit 0
        fi
        echo "Generating broker<->Convex secret, BETTER_AUTH_SECRET, and BROKER_ADMIN_TOKEN..."
        random_hex() { head -c "$$1" /dev/urandom | od -An -tx1 | tr -d ' \n'; }
        BROKER_SECRET="$$(random_hex 32)"
        AUTH_SECRET="$$(random_hex 32)"
        ADMIN_TOKEN="$$(random_hex 32)"
        printf 'BROKER_KEY_ID=convex\nBROKER_SECRET=%s\nBETTER_AUTH_SECRET=%s\nBROKER_ADMIN_TOKEN=%s\n' \
          "$$BROKER_SECRET" "$$AUTH_SECRET" "$$ADMIN_TOKEN" > "$$ENV_FILE"
        echo "Stack secrets generated and persisted."

  broker:
    build:
      # Not "." — with multiple layered compose files (this stack's
      # COMPOSE_FILE), Compose resolves every relative path against the
      # directory of the *first* listed file (apps/convex/docker), not the
      # file that declares the path. This is three levels up from there to
      # reach the actual repo root. See the file-level comment above.
      context: ../../..
      dockerfile: apps/broker/Dockerfile
    restart: unless-stopped
    healthcheck:
      # No curl in node:22-bookworm-slim (unlike the convex-backend image
      # this pattern is copied from) — probe with plain Node instead.
      test: >-
        node -e "require('http').get('http://localhost:4300/health',
        r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 5s
      start_period: 10s
    depends_on:
      convex-bootstrap:
        condition: service_completed_successfully
      broker-secrets-bootstrap:
        condition: service_completed_successfully
    environment:
      CONVEX_URL: http://convex-backend:3210
      CONVEX_ADMIN_KEY_FILE: /run/convex-secrets/opengroow-admin-key
      BROKER_PORT: "4300"
      BROKER_WS_PATH: /openclaw
      BROKER_SECRETS_FILE: /run/broker-secrets/broker-secrets.env
      BROKER_OPENCLAW_KEYS: "{}"
      BROKER_OPENCLAW_KEYS_FILE: /run/openclaw-secrets/openclaw-keys.json
    volumes:
      - convex-data:/run/convex-secrets:ro
      - broker-secrets:/run/broker-secrets:ro
      # Not :ro (unlike the two mounts above): openclaw-local-control's
      # broker-sync (issue #303/#307) propagates key-registry changes by
      # `docker cp`-ing a regenerated openclaw-keys.json straight into this
      # path from the host, then restarting this container so it reloads —
      # the only way to do it, since the broker only ever reads this file
      # once at startup. Recent Docker versions reject `docker cp` into a
      # volume mounted :ro ("mounted volume is marked read-only") even
      # though the write comes from the daemon, not from inside the
      # container — every local-multi createInstance/removeInstance's
      # broker-sync silently failed until this was dropped, leaving every
      # newly created instance's key out of the broker's registry and its
      # runtime-worker stuck disconnecting forever.
      - openclaw-secrets:/run/openclaw-secrets
    # Published to the host, loopback-only — local-multi instances (issue
    # #303) are each their own Compose project, with no shared Docker
    # network to this one, so they reach the
    # broker via host.docker.internal:4300 (their BROKER_WS_URL) instead of
    # the internal "broker" DNS name this stack's own services use. A plain
    # `expose` here is invisible to those other projects' containers.
    ports:
      - "127.0.0.1:${BROKER_HOST_PORT:-4300}:4300"

  # Relay for pairing a remote/NAT'd device to a Project's gateway
  # (ADR-006, ADR-031) — proxies a ticket-authenticated WebSocket to the
  # broker's admin relay endpoint (BROKER_ADMIN_TOKEN-gated
  # /broker/admin/relay). Runs as a compose service like every other part of
  # this stack; only its *client* (apps/openclaw-connect's node-run, the
  # "remote helper") runs elsewhere, on the machine being paired — that's
  # the whole point of the feature.
  openclaw-connect:
    build:
      context: ../../..
      dockerfile: apps/openclaw-connect/Dockerfile
    restart: unless-stopped
    depends_on:
      convex-bootstrap:
        condition: service_completed_successfully
      broker:
        condition: service_started
    environment:
      PORT: "4700"
      CONVEX_URL: http://convex-backend:3210
      CONVEX_ADMIN_KEY_FILE: /run/convex-secrets/opengroow-admin-key
      BROKER_ADMIN_URL: http://broker:4300
      BROKER_SECRETS_FILE: /run/broker-secrets/broker-secrets.env
    volumes:
      - convex-data:/run/convex-secrets:ro
      - broker-secrets:/run/broker-secrets:ro
    ports:
      - "${OPENCLAW_CONNECT_PORT:-4700}:4700"

  dashboard:
    build:
      context: ../../..
      dockerfile: apps/dashboard/Dockerfile
    restart: unless-stopped
    depends_on:
      convex-bootstrap:
        condition: service_completed_successfully
      broker:
        condition: service_started
    environment:
      # Browser-facing URLs, read at request time (no rebuild to change them,
      # see apps/dashboard/src/lib/public-urls.ts). The names without the
      # PUBLIC_ prefix below are the internal addresses.
      PUBLIC_CONVEX_URL: ${NEXT_PUBLIC_CONVEX_URL:-http://127.0.0.1:3210}
      PUBLIC_APP_URL: ${DASHBOARD_URL:-http://localhost:3912}
      PUBLIC_SEO_MCP_URL: ${NEXT_PUBLIC_SEO_MCP_URL:-http://127.0.0.1:3500}
      # Server-only — points the dashboard's own server-side Convex auth
      # check at the internal backend address. See
      # apps/dashboard/src/lib/auth-server.ts.
      CONVEX_SITE_URL: http://convex-backend:3211
      CONVEX_URL: http://convex-backend:3210
      BROKER_HEALTH_URL: http://broker:4300/health
      # Same server-only split as CONVEX_SITE_URL above, for the connect
      # ticket status proxy (app/api/connect-ticket-status/route.ts): the
      # ticket's own connectUrl origin is OPENCLAW_CONNECT_PUBLIC_BASE_URL
      # (http://localhost:4700 here — correct for the browser/remote-helper,
      # meaningless from inside this container).
      OPENCLAW_CONNECT_INTERNAL_URL: http://openclaw-connect:4700
      # Gates hosted-only admin views and self-host-specific dashboard
      # affordances (apps/dashboard/src/lib/self-host.ts) — read server-side,
      # so this works via plain container env, no rebuild needed. No-op in the OSS export: that mirror hardcodes this true.
      IS_SELF_HOST: ${IS_SELF_HOST:-1}
      # Optional OpenClaw plugins (codex, whatsapp): the dashboard hides the
      # features of the ones not listed. Same value as the instances get.
      OPENCLAW_OPTIONAL_PLUGINS: ${OPENCLAW_OPTIONAL_PLUGINS:-}
    ports:
      - "${DASHBOARD_PORT:-3912}:3912"

volumes:
  broker-secrets:
  # Not populated by any bootstrap service in this stack — written to and
  # read from exclusively by openclaw-local-control's broker-sync (issue
  # #303/#307), which `docker cp`s a regenerated openclaw-keys.json into the
  # broker's mount of this volume every time a local-multi instance is
  # created/removed/rolled out, then restarts the broker so it reloads.
  openclaw-secrets:
