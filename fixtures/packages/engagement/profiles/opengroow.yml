externalJobsBySource:
  video-post:
    analyze_video:
      server: feed-mcp
      mcpTool: get_analyze_video_status
      statusField: status
      outputIsRoot: true
      terminalStates:
        completed:
          - completed
        failed:
          - failed
      unavailableErrorCodes:
        - video_unavailable
        - video_private
openclawProfile:
  execNode: My Computer
