name: Build OpenClaw Images

# One workflow for the three OpenClaw images, because the gateway and the
# runtime-worker are built FROM the shared base image (node + the pinned
# `openclaw` CLI): the base must be published first, in the same run, so a
# bump of apps/openclaw-docker-config/OPENCLAW_VERSION can never publish an
# image built on the previous base.

on:
  push:
    branches: [main]
    paths:
      - "apps/openclaw-docker-config/**"
      - "apps/openclaw-runtime-worker/**"
      - "packages/hmac/**"
      - "packages/protocol/**"
      - "scripts/docker/**"
      - ".github/workflows/openclaw-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Registry + organization the images are published to. Set the repository
  # variable IMAGE_REGISTRY (e.g. ghcr.io/<org>) to publish elsewhere; the
  # default is GHCR under this repository's owner. For a registry other than
  # GHCR, also set the secrets REGISTRY_USERNAME / REGISTRY_PASSWORD.
  IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || format('ghcr.io/{0}', github.repository_owner) }}

jobs:
  base:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.image.outputs.ref }}:sha-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image reference
        id: image
        run: |
          registry="${IMAGE_REGISTRY,,}"
          echo "host=${registry%%/*}" >> "$GITHUB_OUTPUT"
          echo "ref=${registry}/openclaw-base" >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.host }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.ref }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/openclaw-docker-config
          file: apps/openclaw-docker-config/docker/base/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  gateway:
    needs: base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate config and check secrets
        run: |
          apps/openclaw-docker-config/scripts/validate-config.sh
          apps/openclaw-docker-config/scripts/check-secrets.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image reference
        id: image
        run: |
          registry="${IMAGE_REGISTRY,,}"
          echo "host=${registry%%/*}" >> "$GITHUB_OUTPUT"
          echo "ref=${registry}/openclaw-gateway" >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.host }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.ref }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/openclaw-docker-config
          file: apps/openclaw-docker-config/docker/Dockerfile
          build-args: |
            OPENCLAW_BASE_IMAGE=${{ needs.base.outputs.ref }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  runtime-worker:
    needs: base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate config and check secrets
        run: |
          apps/openclaw-docker-config/scripts/validate-config.sh
          apps/openclaw-docker-config/scripts/check-secrets.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image reference
        id: image
        run: |
          registry="${IMAGE_REGISTRY,,}"
          echo "host=${registry%%/*}" >> "$GITHUB_OUTPUT"
          echo "ref=${registry}/openclaw-runtime-worker" >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.host }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.ref }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Prepare build context
        run: apps/openclaw-docker-config/scripts/prepare-runtime-worker-context.sh "$RUNNER_TEMP/rw-context"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/rw-context
          file: ${{ runner.temp }}/rw-context/apps/openclaw-docker-config/docker/runtime-worker/Dockerfile
          build-args: |
            OPENCLAW_BASE_IMAGE=${{ needs.base.outputs.ref }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
