name: Publish Template Validator

# Publishes @opengroow/template-validator, a bundle of the manifest reader in
# packages/agent-templates, so hub repositories validate with the product's own code.
#
# To release: bump "version" in packages/template-validator/package.json, merge, then
#   git tag template-validator@<version> && git push origin template-validator@<version>
#
# No npm token: this uses npm trusted publishing (OIDC). On npmjs.com, package
# @opengroow/template-validator, Settings, Trusted Publisher, GitHub Actions: set the
# organization/user and repository that hold this workflow, and the workflow file name
# `publish-template-validator.yml`. Renaming the repository or this file means updating that setting.
# Only a tag push triggers it, so only people who can push tags can publish.

on:
  push:
    tags:
      - "template-validator@*"

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC), no stored secret

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile --filter @opengroow/template-validator...

      - name: The tag matches the package version
        run: |
          version=$(node -p "require('./packages/template-validator/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "template-validator@${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Test
        run: pnpm exec vitest run packages/template-validator packages/agent-templates

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships an older one.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Publish
        working-directory: packages/template-validator
        run: npm publish --access public
